<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="vnd-promo-wt">
  <title id="vnd-promo-wt">Exemplo do relatório da análise do site: velocidade no telemóvel, Google e IAs</title>
  <defs>
    <linearGradient id="vnd-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef5c32"/>
      <stop offset="1" stop-color="#f59e4c"/>
    </linearGradient>
    <filter id="vnd-s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>
  <!-- Versão larga (computador): o relatório ao centro, o telemóvel à esquerda, as IAs e o Google à direita. -->
  <rect x="0" y="0" width="1400" height="500" fill="url(#vnd-g)" opacity=".14"/>
  <circle cx="1240" cy="40" r="170" fill="url(#vnd-g)" opacity=".13"/>
  <circle cx="110" cy="470" r="150" fill="url(#vnd-g)" opacity=".12"/>
  <circle cx="1330" cy="440" r="36" fill="url(#vnd-g)" opacity=".2"/>
  <circle cx="380" cy="60" r="20" fill="url(#vnd-g)" opacity=".22"/>

  <!-- Telemóvel: a velocidade -->
  <g transform="translate(150 78)">
    <g filter="url(#vnd-s)"><rect x="0" y="0" width="190" height="350" rx="30" fill="#0d0d0d"/></g>
    <rect x="10" y="12" width="170" height="326" rx="22" fill="#ffffff"/>
    <rect x="70" y="20" width="50" height="8" rx="4" fill="#d6d1c9"/>
    <text x="95" y="62" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#0d0d0d">Telemóvel</text>
    <circle cx="95" cy="130" r="44" fill="none" stroke="#efeae3" stroke-width="11"/>
    <circle cx="95" cy="130" r="44" fill="none" stroke="#e5484d" stroke-width="11" stroke-linecap="round" stroke-dasharray="105 277" transform="rotate(-90 95 130)"/>
    <text x="95" y="139" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="800" fill="#0d0d0d">38</text>
    <text x="95" y="200" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#5c5852">Demora 4,8 s a abrir</text>
    <rect x="28" y="222" width="134" height="10" rx="5" fill="#efeae3"/>
    <rect x="28" y="222" width="38" height="10" rx="5" fill="#e5484d"/>
    <rect x="28" y="248" width="134" height="40" rx="10" fill="#fdecec"/>
    <text x="95" y="273" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#c4320a">Lento: perde visitas</text>
    <rect x="60" y="312" width="70" height="6" rx="3" fill="#d6d1c9"/>
  </g>

  <!-- As IAs: aparece ou não? -->
  <g transform="translate(1040 92)">
    <g filter="url(#vnd-s)"><rect x="0" y="0" width="250" height="176" rx="18" fill="#ffffff"/></g>
    <circle cx="28" cy="30" r="14" fill="url(#vnd-g)"/>
    <path d="M28 22l2.2 5.8 5.8 2.2-5.8 2.2L28 38l-2.2-5.8-5.8-2.2 5.8-2.2z" fill="#ffffff"/>
    <text x="50" y="35" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#0d0d0d">ChatGPT · Gemini</text>
    <rect x="62" y="56" width="172" height="34" rx="12" fill="#f3efe9"/>
    <text x="74" y="78" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#0d0d0d">“Uma padaria em Lisboa?”</text>
    <rect x="16" y="100" width="190" height="56" rx="12" fill="#fdecec"/>
    <circle cx="36" cy="128" r="10" fill="#e5484d" opacity=".18"/>
    <path d="M32.5 124.5l7 7M39.5 124.5l-7 7" stroke="#e5484d" stroke-width="2.2" stroke-linecap="round"/>
    <text x="54" y="124" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0d0d0d">O seu negócio</text>
    <text x="54" y="140" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#5c5852">não é recomendado</text>
  </g>
  <!-- O Google -->
  <g transform="translate(1066 290)">
    <g filter="url(#vnd-s)"><rect x="0" y="0" width="210" height="96" rx="16" fill="#ffffff"/></g>
    <text x="20" y="32" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#4285f4">G<tspan fill="#ea4335">o</tspan><tspan fill="#fbbc05">o</tspan><tspan fill="#4285f4">g</tspan><tspan fill="#34a853">l</tspan><tspan fill="#ea4335">e</tspan></text>
    <rect x="20" y="46" width="170" height="8" rx="4" fill="#efeae3"/>
    <rect x="20" y="62" width="120" height="8" rx="4" fill="#efeae3"/>
    <text x="150" y="33" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0b429">p. 3</text>
  </g>

  <g transform="translate(450 60) scale(0.98)">

  <g filter="url(#vnd-s)">
    <rect x="64" y="58" width="432" height="304" rx="18" fill="#ffffff"/>
  </g>
  <path d="M82 58h396a18 18 0 0 1 18 18v22H64V76a18 18 0 0 1 18-18z" fill="#f3efe9"/>
  <circle cx="88" cy="78" r="5" fill="#ef5c32"/>
  <circle cx="106" cy="78" r="5" fill="#f0b429"/>
  <circle cx="124" cy="78" r="5" fill="#d6d1c9"/>
  <rect x="146" y="69" width="230" height="18" rx="9" fill="#ffffff"/>
  <rect x="158" y="75" width="110" height="6" rx="3" fill="#d6d1c9"/>

  <circle cx="160" cy="196" r="56" fill="none" stroke="#efeae3" stroke-width="14"/>
  <circle cx="160" cy="196" r="56" fill="none" stroke="url(#vnd-g)" stroke-width="14" stroke-linecap="round" stroke-dasharray="211 352" transform="rotate(-90 160 196)"/>
  <text x="160" y="204" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="800" fill="#0d0d0d">62</text>
  <text x="160" y="226" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#8a847c">de 100</text>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#0d0d0d">
    <circle cx="262" cy="146" r="11" fill="#2f9e44" opacity=".16"/>
    <path d="M256.5 146.3l3.6 3.6 7-7.2" fill="none" stroke="#2f9e44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="284" y="151">Google</text>
    <rect x="388" y="140" width="76" height="12" rx="6" fill="#2f9e44" opacity=".22"/>

    <circle cx="262" cy="196" r="11" fill="#f0b429" opacity=".2"/>
    <path d="M262 189.5v8" stroke="#c98a00" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="262" cy="202" r="1.6" fill="#c98a00"/>
    <text x="284" y="201">Telemóvel</text>
    <rect x="388" y="190" width="54" height="12" rx="6" fill="#f0b429" opacity=".35"/>

    <circle cx="262" cy="246" r="11" fill="#e5484d" opacity=".16"/>
    <path d="M257.8 241.8l8.4 8.4M266.2 241.8l-8.4 8.4" stroke="#e5484d" stroke-width="2.4" stroke-linecap="round"/>
    <text x="284" y="251">Segurança</text>
    <rect x="388" y="240" width="34" height="12" rx="6" fill="#e5484d" opacity=".25"/>
  </g>

  <rect x="96" y="294" width="368" height="40" rx="20" fill="#0d0d0d"/>
  <path d="M120 306h12l6 6v12a2 2 0 0 1-2 2h-16a2 2 0 0 1-2-2v-16a2 2 0 0 1 2-2z" fill="none" stroke="#ef5c32" stroke-width="2"/>
  <text x="148" y="319" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Relatório em PDF no seu email</text>

  <g filter="url(#vnd-s)">
    <rect x="402" y="26" width="132" height="48" rx="14" fill="#ffffff"/>
  </g>
  <rect x="416" y="40" width="26" height="20" rx="4" fill="none" stroke="#ef5c32" stroke-width="2"/>
  <path d="M417 42l12 9 12-9" fill="none" stroke="#ef5c32" stroke-width="2" stroke-linejoin="round"/>
  <text x="452" y="55" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#0d0d0d">Em minutos</text>
  <g filter="url(#vnd-s)">
    <rect x="-20" y="250" width="150" height="46" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="4" cy="273" r="11" fill="#2f9e44" opacity=".16"/>
  <path d="M-1.5 273.3l3.6 3.6 7-7.2" fill="none" stroke="#2f9e44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="278" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#0d0d0d">Sem compromisso</text>
  </g>
</svg>
