name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder

  e2e:
    name: Migrações + E2E (Supabase local)
    runs-on: ubuntu-latest
    needs: checks
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_EMAIL: e2e@vndesign.pt
      E2E_PASSWORD: e2e-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Arrancar Supabase (aplica as migrações)
        run: npx supabase start -x studio,imgproxy,vector,logflare,realtime,edge-runtime,supavisor
      - name: Configurar variáveis
        run: |
          npx supabase status -o env > supabase.env
          URL=$(grep '^API_URL=' supabase.env | cut -d= -f2- | tr -d '"')
          PUB=$(grep '^PUBLISHABLE_KEY=' supabase.env | cut -d= -f2- | tr -d '"')
          SEC=$(grep '^SECRET_KEY=' supabase.env | cut -d= -f2- | tr -d '"')
          npx web-push generate-vapid-keys --json > vapid.json
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUB"
            echo "SUPABASE_SECRET_KEY=$SEC"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=54325"
            echo "CRON_SECRET=ci-cron-secret"
            echo "MAILPIT_URL=http://127.0.0.1:54324"
            echo "AUDIT_ALLOW_PRIVATE=1"
            echo "AUDIT_SKIP_PAGESPEED=1"
            echo "VAPID_PUBLIC_KEY=$(node -p "require('./vapid.json').publicKey")"
            echo "VAPID_PRIVATE_KEY=$(node -p "require('./vapid.json').privateKey")"
            echo "VAPID_SUBJECT=mailto:ci@vndesign.pt"
            echo "ANTHROPIC_API_KEY=sk-ant-teste"
            echo "AI_BASE_URL=http://127.0.0.1:4621"
            echo "GEOCODER_URL=http://127.0.0.1:4620/search"
          } > apps/web/.env.local
          echo "SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "SUPABASE_KEY=$PUB" >> "$GITHUB_ENV"
      - name: Paridade TypeScript ↔ SQL
        run: npm test -w @vndesign/core
      - run: npm run create-user -- --email "$E2E_EMAIL" --password "$E2E_PASSWORD" --name "E2E"
      - run: npm run build
      - name: Arrancar a aplicação
        run: npm run start & npx --yes wait-on http://localhost:3000/login
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
